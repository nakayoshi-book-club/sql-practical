<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SQL実践入門ドリル</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=M+PLUS+1+Code:wght@600&family=Zen+Kaku+Gothic+New:wght@900&display=swap">
<style>
:root {
  --bg: #e8ecf0; --surface: #f7f9fb; --ink: #17202b; --muted: #55606e; --line: #cdd4dc; --accent: #2448b8;
  --f-display: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
  --f-body: "BIZ UDPGothic", "Hiragino Sans", sans-serif;
  --f-code: "M PLUS 1 Code", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #10151c; --surface: #18202a; --ink: #e6ebf1; --muted: #9aa6b4; --line: #2c3643; --accent: #85a2ff; color-scheme: dark; }
}
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); line-height: 1.7; padding-inline: 16px; padding-block: 48px; }
main { max-width: 760px; margin-inline: auto; display: flex; flex-direction: column; gap: 24px; }
h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(28px, 5vw, 40px); line-height: 1.3; margin: 0; text-wrap: balance; }
p { margin: 0; color: var(--muted); }
ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
a.ch { display: grid; grid-template-columns: 4.5em minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; color: inherit; text-decoration: none; }
a.ch:hover, a.ch:focus-visible { border-color: var(--accent); outline: none; }
.no { font-family: var(--f-code); font-weight: 600; color: var(--accent); }
.name { font-weight: 700; }
.desc { display: block; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>SQL実践入門ドリル</h1>
  <p>『［改訂新版］SQL実践入門』の章ごとの演習です。選択肢を選ぶと、PostgreSQL 16とMySQL 8.0で取得した実行計画が表示されます。</p>
  <ol>
    <li><a class="ch" href="ch03/"><span class="no">第3章</span><span><span class="name">SQLにおける条件分岐</span><span class="desc">UNIONとCASE式の書き分けを10問で確かめる</span></span></a></li>
  </ol>
</main>
</body>
</html>
